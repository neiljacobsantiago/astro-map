<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#04050a">
<title>The Long Hall</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Sora:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>

<canvas id="stage"></canvas>
<div class="haze" aria-hidden="true"></div>

<!-- ─────────────────────────── airlock -->
<div class="gate" id="gate">
  <div class="gate__in">
    <p class="eyebrow">A gallery in orbit</p>
    <p class="gate__s"><b id="gateN">—</b> frames, hung in a corridor that doesn't end.</p>
    <div class="gate__bar"><i id="gateBar"></i></div>
    <button class="btn btn--big" id="enter" disabled><span>Begin</span></button>
  </div>
</div>

<div class="fallback" id="fallback" hidden>
  <p>This device can't render the hall.<br><span>Try Chrome or Safari elsewhere.</span></p>
</div>

<!-- ─────────────────────────── hud -->
<div class="hud" id="hud">
  <header class="top">
    <span class="top__n">THE LONG HALL</span>
    <span class="top__c"><b id="hudNum">001</b><i>/</i><span id="hudTot">50</span></span>
  </header>

  <div class="marks" id="marks"></div>

  <p class="cue" id="cue">Scroll to fly</p>

  <nav class="dock" id="dock">
    <div class="rail"><i id="railFill"></i></div>
    <button class="dk" id="chartBtn"><svg viewBox="0 0 20 20"><circle cx="4" cy="5" r="1.5"/><circle cx="14" cy="4" r="1.1"/><circle cx="9" cy="11" r="1.5"/><circle cx="16" cy="14" r="1.1"/><circle cx="5" cy="16" r="1.1"/><path d="M4 5 9 11 14 4M9 11 16 14M9 11 5 16"/></svg><span>Chart</span></button>
    <button class="dk" id="driftBtn"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3"/><circle cx="7" cy="7" r="1.2" class="f"/><circle cx="13" cy="13" r="1.2" class="f"/><circle cx="13" cy="7" r="1.2" class="f"/></svg><span>Drift</span></button>
    <button class="dk" id="favBtn"><svg viewBox="0 0 20 20"><path d="M10 3.6l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg><span id="favN">0</span></button>
    <button class="dk" id="sndBtn" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M4 8h3l4-3v10l-4-3H4z"/><path d="M14 7a4 4 0 010 6" class="w"/></svg><span>Sound</span></button>
  </nav>
</div>

<!-- ─────────────────────────── plaque -->
<section class="plaque" id="plaque" hidden>
  <button class="plaque__x" id="plaqueX">Close</button>
  <span class="plaque__id" id="plaqueId">001</span>
  <div class="plaque__row">
    <button class="plaque__fav" id="plaqueFav" aria-pressed="false">
      <svg viewBox="0 0 20 20"><path d="M10 3.6l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
      <span>Keep</span>
    </button>
    <button class="plaque__nav" id="plaqueFull">View full</button>
    <button class="plaque__nav" id="plaquePrev">‹</button>
    <button class="plaque__nav" id="plaqueNext">›</button>
  </div>
</section>

<!-- ─────────────────────────── chart -->
<div class="chart" id="chart" hidden>
  <button class="chart__x" id="chartX">Close</button>
  <p class="eyebrow">Tap a point to travel</p>
  <div class="chart__wrap"><svg id="chartSvg" viewBox="0 0 100 100"></svg></div>
</div>

<!-- ─────────────────────────── full photo -->
<div class="view" id="view" hidden>
  <button class="view__x" id="viewX" aria-label="Close">✕</button>
  <button class="view__nav view__nav--p" id="viewPrev" aria-label="Previous">‹</button>
  <button class="view__nav view__nav--n" id="viewNext" aria-label="Next">›</button>
  <div class="view__fig"><img id="viewImg" alt=""><div class="view__spin" id="viewSpin"></div></div>
  <div class="view__bar">
    <span class="view__id" id="viewId">001</span>
    <button class="view__fav" id="viewFav" aria-pressed="false">
      <svg viewBox="0 0 20 20"><path d="M10 3.6l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
    </button>
  </div>
  <p class="view__hint">Swipe · tap outside to close</p>
</div>

<div class="cursor" id="cursor" aria-hidden="true"><span></span></div>
<div class="track" id="track" aria-hidden="true"></div>

<script src="photos.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
